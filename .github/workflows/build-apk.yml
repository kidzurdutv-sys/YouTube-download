name: Build Android APK

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev build-essential ccache libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython>=3.0,<3.1"

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          if [ -f "buildozer.spec" ]; then
            yes | buildozer -v android debug 2>&1 | tee build_log.txt
          elif [ -f "shorts-downloader-android/buildozer.spec" ]; then
            cd shorts-downloader-android
            yes | buildozer -v android debug 2>&1 | tee build_log.txt
          fi

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: |
            build_log.txt
            shorts-downloader-android/build_log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-downloader-apk
          path: |
            bin/*.apk
            shorts-downloader-android/bin/*.apk
          if-no-files-found: error
